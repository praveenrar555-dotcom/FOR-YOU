<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kritika 👑</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at 50% 40%, #40205b 0%, #160b27 48%, #05030c 100%);
  color: white;
  font-family: 'Cinzel', serif;
}

.scene {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  perspective: 1000px;
  overflow: hidden;
}

.ambient {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: #ffbb38;
  filter: blur(100px);
  opacity: .17;
  animation: glow 4s ease-in-out infinite alternate;
}

@keyframes glow {
  from { transform: scale(.8); opacity: .1; }
  to { transform: scale(1.25); opacity: .28; }
}

.crown-wrap {
  position: relative;
  z-index: 2;
  width: min(85vw, 410px);
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 20px 22px #0009);
}

.crown {
  width: 100%;
  overflow: visible;
  transform-style: preserve-3d;
  animation: royalTurn 8s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-18px); }
}

@keyframes royalTurn {
  0%, 100% { transform: rotateY(-12deg) rotateX(3deg); }
  50% { transform: rotateY(12deg) rotateX(-2deg); }
}

.title {
  position: relative;
  z-index: 3;
  margin-top: 8px;
  text-align: center;
  padding: 0 15px;
  animation: appear 2s ease both;
}

.small {
  color: #ffe8ac;
  font-size: 11px;
  letter-spacing: 6px;
  margin-bottom: 16px;
  text-shadow: 0 0 15px #ffd45e;
}

h1 {
  font-family: 'Great Vibes', cursive;
  font-weight: 400;
  font-size: clamp(39px, 10vw, 68px);
  line-height: 1.2;
  background: linear-gradient(
    180deg, #fff9d8, #ffda69 35%,
    #c88719 65%, #fff0ae 85%, #ad7013
  );
  background-size: 100% 200%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 14px #f5b83955);
  animation: goldShine 4s linear infinite;
}

@keyframes goldShine {
  0%, 100% { background-position: 0 0%; }
  50% { background-position: 0 100%; }
}

.subtitle {
  margin-top: 16px;
  color: #f6dca2;
  font-size: 10px;
  letter-spacing: 4px;
  opacity: .85;
}

.line {
  width: 100px;
  height: 1px;
  margin: 20px auto 0;
  background: linear-gradient(90deg, transparent, #ffda77, transparent);
  box-shadow: 0 0 10px #ffcf62;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

.sparkles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.spark {
  position: absolute;
  color: #ffe7a0;
  text-shadow: 0 0 10px #ffca43, 0 0 22px #ffbb2d;
  animation: sparkle linear infinite;
}

@keyframes sparkle {
  0% { transform: translateY(30px) scale(0); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: .9; }
  100% { transform: translateY(-110px) scale(1.3); opacity: 0; }
}

.floor {
  position: absolute;
  bottom: 9%;
  width: min(75vw, 340px);
  height: 40px;
  border-radius: 50%;
  background: #e8a9ff;
  filter: blur(38px);
  opacity: .14;
}

.hint {
  position: absolute;
  bottom: 22px;
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: #bca9cf;
  opacity: .7;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 15s !important;
  }
}
</style>
</head>

<body>
<div class="scene">
  <div class="ambient"></div>
  <div class="sparkles" id="sparkles"></div>
  <div class="floor"></div>

  <div class="crown-wrap">
    <svg class="crown" viewBox="0 0 420 310"
         xmlns="http://www.w3.org/2000/svg">

      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff5b7"/>
          <stop offset=".18" stop-color="#d99a24"/>
          <stop offset=".32" stop-color="#fff0a0"/>
          <stop offset=".5" stop-color="#a96209"/>
          <stop offset=".68" stop-color="#f8cb54"/>
          <stop offset=".85" stop-color="#b77713"/>
          <stop offset="1" stop-color="#fff0a2"/>
        </linearGradient>

        <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff2a6"/>
          <stop offset=".2" stop-color="#e9ae32"/>
          <stop offset=".55" stop-color="#a9620a"/>
          <stop offset=".8" stop-color="#f2bd47"/>
          <stop offset="1" stop-color="#77420b"/>
        </linearGradient>

        <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#fff0ff"/>
          <stop offset=".35" stop-color="#ef78d9"/>
          <stop offset=".7" stop-color="#a30d8c"/>
          <stop offset="1" stop-color="#ffd5ff"/>
        </linearGradient>

        <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#fff"/>
          <stop offset=".45" stop-color="#a9eaff"/>
          <stop offset=".7" stop-color="#f6d9ff"/>
          <stop offset="1" stop-color="#fff"/>
        </linearGradient>

        <filter id="shine">
          <feGaussianBlur stdDeviation="2.4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Back silhouette -->
      <path d="M70 115 L30 40 L105 88 L140 15
               L210 75 L280 15 L315 88 L390 40
               L350 115 L335 205 L85 205 Z"
            fill="#7a450c" stroke="#ffdf77" stroke-width="4"/>

      <!-- Main crown body -->
      <path d="M30 40 L105 88 L140 15 L210 75
               L280 15 L315 88 L390 40
               L345 205 L75 205 Z"
            fill="url(#gold)" stroke="#fff0aa" stroke-width="3"
            stroke-linejoin="round"/>

      <!-- Inner gold facets -->
      <path d="M30 40 L150 125 L105 88 Z"
            fill="#fff1a0" opacity=".55"/>
      <path d="M140 15 L180 135 L210 75 Z"
            fill="#fff7c4" opacity=".45"/>
      <path d="M280 15 L240 135 L210 75 Z"
            fill="#ffdf69" opacity=".7"/>
      <path d="M390 40 L270 125 L315 88 Z"
            fill="#fff0a4" opacity=".55"/>

      <!-- Center jewel mount -->
      <path d="M175 95 L210 70 L245 95 L235 140
               L185 140 Z"
            fill="url(#gold)" stroke="#fff1b3" stroke-width="2"/>

      <!-- Large diamond -->
      <path d="M210 83 L235 105 L210 137 L185 105 Z"
            fill="url(#diamond)" stroke="#fff" stroke-width="2"
            filter="url(#shine)"/>
      <path d="M210 83 L210 137 M185 105 L235 105"
            stroke="#ffffff" stroke-width="1" opacity=".8"/>

      <!-- Side gemstones -->
      <g stroke="#ffe8a0" stroke-width="2">
        <path d="M105 92 L123 111 L105 135 L87 111 Z"
              fill="url(#ruby)"/>
        <path d="M315 92 L333 111 L315 135 L297 111 Z"
              fill="url(#ruby)"/>
        <path d="M153 120 L167 134 L153 151 L139 134 Z"
              fill="url(#diamond)"/>
        <path d="M267 120 L281 134 L267 151 L253 134 Z"
              fill="url(#diamond)"/>
      </g>

      <!-- Decorative circular studs -->
      <g fill="#fff1b2" stroke="#b97916" stroke-width="2">
        <circle cx="69" cy="142" r="7"/>
        <circle cx="351" cy="142" r="7"/>
        <circle cx="125" cy="165" r="6"/>
        <circle cx="295" cy="165" r="6"/>
        <circle cx="210" cy="158" r="7"/>
      </g>

      <!-- Ornate lower band -->
      <path d="M75 174 Q210 215 345 174
               L354 220 Q210 270 66 220 Z"
            fill="url(#front)" stroke="#ffe7a0" stroke-width="3"/>

      <path d="M73 191 Q210 230 347 191"
            fill="none" stroke="#fff2b0" stroke-width="3"/>

      <path d="M66 220 Q210 270 354 220
               L348 247 Q210 300 72 247 Z"
            fill="url(#gold)" stroke="#ffe6a0" stroke-width="3"/>

      <!-- Beaded base -->
      <path d="M73 247 Q210 296 347 247"
            fill="none" stroke="#fff3b7" stroke-width="3"/>

      <g fill="#fff0a0" stroke="#b57a18" stroke-width="1">
        <circle cx="91" cy="241" r="4"/>
        <circle cx="120" cy="255" r="4"/>
        <circle cx="151" cy="265" r="4"/>
        <circle cx="181" cy="271" r="4"/>
        <circle cx="210" cy="273" r="5"/>
        <circle cx="239" cy="271" r="4"/>
        <circle cx="269" cy="265" r="4"/>
        <circle cx="300" cy="255" r="4"/>
        <circle cx="329" cy="241" r="4"/>
      </g>

      <!-- Glints -->
      <g fill="#fff" filter="url(#shine)">
        <path d="M140 2 L144 12 L154 16 L144 20 L140 30
                 L136 20 L126 16 L136 12 Z"/>
        <path d="M280 3 L283 11 L291 14 L283 17 L280 25
                 L277 17 L269 14 L277 11 Z"/>
        <path d="M210 53 L213 61 L221 64 L213 67
                 L210 75 L207 67 L199 64 L207 61 Z"/>
      </g>
    </svg>
  </div>

  <div class="title">
    <div class="small">✦ A LITTLE GIFT FOR YOU ✦</div>
    <h1>This is for you<br>Kritika</h1>
    <div class="line"></div>
    <div class="subtitle">YOU ARE ONE OF A KIND</div>
  </div>

  <div class="hint">✧ MADE WITH LOVE ✧</div>
</div>

<script>
const layer = document.getElementById('sparkles');

function createSparkle() {
  const s = document.createElement('span');
  s.className = 'spark';
  s.textContent = Math.random() > .5 ? '✦' : '✧';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = (30 + Math.random() * 65) + '%';
  s.style.fontSize = (8 + Math.random() * 18) + 'px';
  s.style.animationDuration = (3 + Math.random() * 4) + 's';
  layer.appendChild(s);

  setTimeout(() => s.remove(), 7500);
}

for (let i = 0; i < 24; i++) {
  setTimeout(createSparkle, i * 180);
}

setInterval(createSparkle, 260);
</script>
</body>
</html>
