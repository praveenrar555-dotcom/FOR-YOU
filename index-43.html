<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Kritika 💌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --aubergine: #2B1B2E;
        --aubergine-deep: #1D1120;
        --rose: #D8A7B1;
        --gold: #C9A227;
        --blush: #F1DDE3;
        --ivory: #F7F3F0;
        --serif: 'Cormorant Garamond', serif;
        --sans: 'Poppins', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; }
      body {
        font-family: var(--sans);
        background: var(--aubergine);
        color: var(--ivory);
        -webkit-font-smoothing: antialiased;
      }
      button { font-family: var(--sans); cursor: pointer; }

      /* ---------- Login ---------- */
      .login-screen {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 20%, var(--aubergine-deep), var(--aubergine) 70%);
        padding: 24px;
      }
      .character-canvas { position: absolute; inset: 0; z-index: 1; }
      .character-canvas canvas { display: block; width: 100%; height: 100%; }
      .login-hint {
        position: absolute; bottom: 40px; z-index: 2;
        color: var(--rose); font-size: 13px; opacity: 0.8;
      }
      .login-card {
        position: relative; z-index: 2;
        max-width: 380px; width: 100%;
        background: rgba(29, 17, 32, 0.85);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(216, 167, 177, 0.25);
        border-radius: 4px;
        padding: 40px 32px;
        text-align: center;
      }
      .login-card.is-hidden { opacity: 0; transform: translateY(-140%); pointer-events: none; }
      .login-card.is-revealed {
        opacity: 1; transform: translateY(0);
        transition: transform 0.75s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 0.5s ease;
      }
      .login-eyebrow { font-size: 13px; letter-spacing: 0.04em; color: var(--rose); margin: 0 0 8px; }
      .login-card h1 {
        font-family: var(--serif); font-weight: 600; font-size: 28px;
        line-height: 1.3; margin: 0 0 28px; color: var(--ivory);
      }
      .login-card form { display: flex; flex-direction: column; gap: 16px; text-align: left; }
      .login-card label { display: flex; flex-direction: column; font-size: 13px; color: var(--blush); gap: 6px; }
      .login-card input {
        font-family: var(--sans); font-size: 15px; padding: 10px 12px;
        border-radius: 3px; border: 1px solid rgba(216, 167, 177, 0.3);
        background: rgba(247, 243, 240, 0.06); color: var(--ivory);
      }
      .login-card input:focus { outline: 2px solid var(--rose); outline-offset: 1px; }
      .login-error { color: var(--gold); font-size: 13px; margin: 0; }
      .login-card button {
        margin-top: 8px; padding: 12px; border: none; border-radius: 3px;
        background: var(--rose); color: var(--aubergine-deep);
        font-weight: 600; font-size: 15px;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .login-card button:hover { background: var(--gold); }

      /* ---------- Layout / Nav ---------- */
      .top-nav {
        position: sticky; top: 0; z-index: 20;
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 28px;
        background: rgba(29, 17, 32, 0.85);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid rgba(216, 167, 177, 0.15);
        flex-wrap: wrap; gap: 12px;
      }
      .nav-brand { font-family: var(--serif); font-size: 20px; color: var(--rose); }
      .nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
      .nav-links button {
        background: transparent; border: none; color: var(--ivory);
        font-size: 13px; padding: 6px 10px; border-radius: 3px; opacity: 0.8;
      }
      .nav-links button:hover { opacity: 1; color: var(--gold); }

      /* ---------- Hero ---------- */
      .hero { padding: 100px 28px 60px; text-align: center; max-width: 700px; margin: 0 auto; }
      .hero-eyebrow { color: var(--rose); font-size: 14px; margin-bottom: 12px; }
      .hero h1 {
        font-family: var(--serif); font-weight: 600; font-style: italic;
        font-size: clamp(32px, 6vw, 52px); line-height: 1.2; margin: 0 0 28px;
      }
      .propose-trigger {
        border: 1px solid rgba(216, 167, 177, 0.4); background: transparent;
        color: var(--rose); padding: 10px 20px; border-radius: 20px;
        font-size: 13px; letter-spacing: 0.02em;
      }
      .propose-trigger:hover { background: var(--rose); color: var(--aubergine-deep); }

      /* ---------- Sections ---------- */
      .section { padding: 80px 28px; max-width: 780px; margin: 0 auto; }
      .section-dark { background: transparent; }
      .section-blush { background: var(--blush); color: var(--aubergine-deep); max-width: 100%; border-radius: 0; }
      .section-blush .section-eyebrow { color: #A85B6B; }
      .section-eyebrow { color: var(--rose); font-size: 13px; margin: 0 0 8px; }
      .section h2 {
        font-family: var(--serif); font-weight: 600;
        font-size: clamp(26px, 4vw, 36px); margin: 0 0 32px;
      }

      /* ---------- Timeline ---------- */
      .timeline {
        display: flex; flex-direction: column; gap: 28px;
        border-left: 2px solid rgba(216, 167, 177, 0.3); padding-left: 24px;
      }
      .timeline-item { position: relative; }
      .timeline-marker {
        position: absolute; left: -30px; top: 4px;
        width: 10px; height: 10px; border-radius: 50%; background: var(--gold);
      }
      .timeline-date { font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--rose); margin: 0 0 4px; }
      .timeline-text { margin: 0; line-height: 1.6; color: var(--ivory); opacity: 0.9; }

      /* ---------- Letters ---------- */
      .letters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
      .letter-envelope {
        background: rgba(247, 243, 240, 0.05); border: 1px solid rgba(216, 167, 177, 0.25);
        border-radius: 3px; padding: 24px; text-align: left; color: var(--ivory);
        transition: border-color 0.2s ease;
      }
      .letter-envelope:hover { border-color: var(--rose); }
      .letter-title { font-family: var(--serif); font-size: 20px; font-style: italic; color: var(--rose); }
      .letter-body { margin-top: 14px; line-height: 1.7; font-size: 15px; opacity: 0.92; }

      /* ---------- Reasons jar ---------- */
      .jar-button {
        border: 1px solid var(--aubergine-deep); background: transparent; color: var(--aubergine-deep);
        padding: 12px 24px; border-radius: 3px; font-size: 15px; font-weight: 500;
      }
      .jar-button:hover { background: var(--aubergine-deep); color: var(--blush); }
      .reason-reveal { margin-top: 24px; font-family: var(--serif); font-style: italic; font-size: 22px; max-width: 500px; }

      /* ---------- Gallery ---------- */
      .gallery-empty { opacity: 0.7; font-size: 14px; }
      .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .gallery-item img { width: 100%; border-radius: 3px; display: block; }
      .gallery-item figcaption { font-size: 13px; margin-top: 6px; opacity: 0.8; }

      /* ---------- Quiz ---------- */
      .quiz-question { margin-bottom: 28px; }
      .quiz-question > p { font-size: 17px; margin-bottom: 12px; }
      .quiz-options { display: flex; flex-wrap: wrap; gap: 10px; }
      .quiz-option {
        background: rgba(247, 243, 240, 0.05); border: 1px solid rgba(216, 167, 177, 0.3);
        color: var(--ivory); padding: 10px 16px; border-radius: 3px; font-size: 14px;
      }
      .quiz-option.is-selected { background: var(--rose); color: var(--aubergine-deep); border-color: var(--rose); }
      .quiz-submit {
        border: none; background: var(--gold); color: var(--aubergine-deep);
        padding: 12px 22px; border-radius: 3px; font-weight: 600; margin-top: 8px;
      }
      .quiz-result { margin-top: 16px; font-family: var(--serif); font-size: 20px; font-style: italic; color: var(--rose); }

      /* ---------- Countdown ---------- */
      .countdown-grid { display: flex; gap: 24px; flex-wrap: wrap; }
      .countdown-grid > div { display: flex; flex-direction: column; align-items: center; }
      .countdown-grid span { font-family: var(--serif); font-size: 40px; font-weight: 600; color: var(--aubergine-deep); }
      .countdown-grid small { font-size: 12px; letter-spacing: 0.04em; opacity: 0.75; }

      /* ---------- Future plans ---------- */
      .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
      .plan-card { background: rgba(255, 255, 255, 0.35); border-radius: 3px; padding: 22px; }
      .plan-card h3 { font-family: var(--serif); font-size: 20px; margin: 0 0 8px; }
      .plan-card p { margin: 0; font-size: 14px; line-height: 1.5; }

      /* ---------- Surprise ---------- */
      .surprise-section { text-align: center; position: relative; overflow: hidden; }
      .surprise-button {
        border: none; background: var(--aubergine-deep); color: var(--blush);
        padding: 14px 30px; border-radius: 3px; font-size: 16px; font-weight: 500;
      }
      .surprise-message { margin-top: 20px; font-family: var(--serif); font-style: italic; font-size: 22px; }
      .hearts-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .floating-heart { position: absolute; bottom: -20px; color: #A85B6B; font-size: 20px; animation: floatUp 2.2s ease-in forwards; }
      @keyframes floatUp { to { transform: translateY(-320px) scale(1.3); opacity: 0; } }

      /* ---------- Footer ---------- */
      .app-footer { text-align: center; padding: 40px 28px 60px; font-size: 13px; opacity: 0.6; }

      /* ---------- Propose page ---------- */
      .propose-overlay {
        position: fixed; inset: 0; z-index: 50;
        background: radial-gradient(circle at 50% 30%, var(--aubergine-deep), #12080f 80%);
        display: flex; align-items: center; justify-content: center;
        padding: 32px; text-align: center;
      }
      .propose-close { position: absolute; top: 20px; right: 24px; background: transparent; border: none; color: var(--ivory); font-size: 20px; opacity: 0.6; }
      .propose-close:hover { opacity: 1; }
      .propose-slide { max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 32px; animation: fadeIn 0.6s ease; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .propose-text { font-family: var(--serif); font-style: italic; font-size: clamp(24px, 4.5vw, 34px); line-height: 1.5; color: var(--ivory); margin: 0; }
      .propose-actions { display: flex; gap: 14px; }
      .propose-next, .propose-prev, .propose-yes { border: none; padding: 12px 26px; border-radius: 24px; font-size: 14px; font-weight: 500; }
      .propose-next, .propose-yes { background: var(--rose); color: var(--aubergine-deep); }
      .propose-yes { background: var(--gold); font-size: 16px; padding: 14px 32px; }
      .propose-prev { background: transparent; border: 1px solid rgba(216, 167, 177, 0.4); color: var(--ivory); }
      .propose-dots { display: flex; gap: 6px; }
      .propose-dots .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(216, 167, 177, 0.3); }
      .propose-dots .dot.active { background: var(--rose); }
      .propose-celebration { position: relative; animation: fadeIn 0.8s ease; }
      .propose-celebration h1 { font-family: var(--serif); font-size: 44px; margin: 0 0 16px; }
      .propose-celebration p { font-size: 17px; max-width: 400px; margin: 0 auto; opacity: 0.9; }

      @media (prefers-reduced-motion: reduce) {
        .floating-heart { animation: none; opacity: 0; }
        .login-card.is-revealed { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
